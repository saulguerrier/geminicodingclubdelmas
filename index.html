<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <!-- HEADER -->

        <div class="sidebar-header">

            <div class="gemini-brand">
                <span class="gemini-star">✦</span>
                <span class="gemini-name">Gemini</span>
            </div>

            <!-- Bouton réduire -->
            <button
                type="button"
                class="sidebar-close"
                id="sidebarClose"
                title="Réduire la barre latérale"
                aria-label="Réduire la barre latérale">

                <i class="fa-solid fa-chevron-left"></i>

            </button>

        </div>


        <!-- =================================================
             SIDEBAR MAIN
        ================================================== -->

        <div class="sidebar-main">

            <!-- Nouvelle discussion -->

            <button
                type="button"
                class="new-chat"
                title="Nouvelle discussion">

                <i class="fa-solid fa-plus"></i>

                <span>Nouvelle discussion</span>

            </button>


            <!-- Navigation -->

            <nav class="navigation">

                <a
                    href="#"
                    class="nav-item active"
                    title="Recherchez dans les nouvelles discussions">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <span>
                        Recherchez dans les nouvelles discussions
                    </span>

                </a>


                <a
                    href="#"
                    class="nav-item"
                    title="Image">

                    <i class="fa-regular fa-image"></i>

                    <span>Image</span>

                </a>


                <a
                    href="#"
                    class="nav-item"
                    title="Bibliothèque">

                    <i class="fa-solid fa-book-open"></i>

                    <span>Bibliothèque</span>

                </a>

            </nav>


            <!-- =================================================
                 NOTEBOOKS
            ================================================== -->

            <div class="notebooks-section">

                <div class="section-title">
                    <span>Notebooks</span>
                </div>

                <a
                    href="#"
                    class="nav-item notebook-item"
                    title="Notebooks">

                    <i class="fa-solid fa-plus"></i>

                    <span>Notebooks</span>

                </a>

            </div>

        </div>


        <!-- =================================================
             SIDEBAR BOTTOM
        ================================================== -->

        <div class="sidebar-bottom">

            <div class="account-row">

                <div
                    class="account-info"
                    title="Compte">

                    <div class="account-icon">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div class="account-text">

                        <strong>Compte</strong>

                        <small>Compte personnel</small>

                    </div>

                </div>


                <button
                    type="button"
                    class="settings-btn"
                    title="Paramètres"
                    aria-label="Paramètres">

                    <i class="fa-solid fa-gear"></i>

                </button>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="top-left">

                <!-- Bouton pour rouvrir -->

                <button
                    type="button"
                    class="menu-btn"
                    id="menuBtn"
                    title="Ouvrir la barre latérale"
                    aria-label="Ouvrir la barre latérale">

                    <i class="fa-solid fa-bars"></i>

                </button>


                <!-- Logo mobile -->

                <div class="mobile-brand">

                    <span class="gemini-star">✦</span>

                    <span>Gemini</span>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="top-actions">

                <button
                    type="button"
                    class="upgrade-btn"
                    title="Mettre à niveau">

                    <i class="fa-solid fa-star"></i>

                    <span>Mettre à niveau</span>

                </button>


                <button
                    type="button"
                    class="temporary-chat"
                    title="Activer les discussions temporaires"
                    aria-label="Activer les discussions temporaires">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                </button>

            </div>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="content">

            <div class="welcome">

                <h1>
                    Comment puis-je vous aider,
                    <span>Coding Club Delmas</span> ?
                </h1>

            </div>


            <!-- CHAT -->

            <div class="chat-area">

                <div class="input-box">

                    <div class="input-row">

                        <!-- + -->

                        <button
                            type="button"
                            class="add-btn"
                            title="Ajouter"
                            aria-label="Ajouter">

                            <i class="fa-solid fa-plus"></i>

                        </button>


                        <!-- TEXTE -->

                        <textarea
                            id="messageInput"
                            placeholder="Demander à Gemini"
                            rows="1"></textarea>


                        <!-- MODELE -->

                        <button
                            type="button"
                            class="model-selector"
                            title="Choisir le modèle">

                            <span>Flash-lite</span>

                            <i class="fa-solid fa-chevron-down"></i>

                        </button>


                        <!-- MICRO -->

                        <button
                            type="button"
                            class="mic-btn"
                            title="Microphone"
                            aria-label="Microphone">

                            <i class="fa-solid fa-microphone"></i>

                        </button>

                    </div>

                </div>


                <p class="disclaimer">

                    Gemini peut faire des erreurs.
                    Vérifiez ses réponses.

                </p>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     OVERLAY MOBILE
========================================================== -->

<div
    class="sidebar-overlay"
    id="sidebarOverlay">
</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.getElementById("sidebar");
    const sidebarClose = document.getElementById("sidebarClose");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("sidebarOverlay");
    const textarea = document.getElementById("messageInput");


    /* =====================================================
       FONCTION : OUVRIR
    ====================================================== */

    function openSidebar() {

        sidebar.classList.remove("collapsed");
        sidebar.classList.add("open");

        if (window.innerWidth <= 700) {
            overlay.classList.add("show");
        }

    }


    /* =====================================================
       FONCTION : FERMER / RÉDUIRE
    ====================================================== */

    function closeSidebar() {

        sidebar.classList.remove("open");
        sidebar.classList.add("collapsed");

        overlay.classList.remove("show");

    }


    /* =====================================================
       BOUTON ☰
    ====================================================== */

    if (menuBtn) {

        menuBtn.addEventListener("click", function (event) {

            event.preventDefault();

            openSidebar();

        });

    }


    /* =====================================================
       BOUTON ‹
    ====================================================== */

    if (sidebarClose) {

        sidebarClose.addEventListener("click", function (event) {

            event.preventDefault();

            event.stopPropagation();

            closeSidebar();

        });

    }


    /* =====================================================
       OVERLAY
    ====================================================== */

    if (overlay) {

        overlay.addEventListener("click", function () {

            closeSidebar();

        });

    }


    /* =====================================================
       ESCAPE
    ====================================================== */

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            closeSidebar();

        }

    });


    /* =====================================================
       TEXTAREA AUTO RESIZE
    ====================================================== */

    if (textarea) {

        textarea.addEventListener("input", function () {

            this.style.height = "auto";

            this.style.height =
                Math.min(this.scrollHeight, 180) + "px";

        });

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    window.addEventListener("resize", function () {

        if (window.innerWidth > 700) {

            overlay.classList.remove("show");

        }

    });

});

</script>

</body>
</html>
